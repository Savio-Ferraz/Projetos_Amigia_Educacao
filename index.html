              <option value="Alta">🚩 Alta</option>

          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Iniciais do Responsável</label>
            <input type="text" id="inputAssignee" placeholder="Ex: SF" maxlength="2" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs uppercase font-bold text-center focus:outline-none">

        <div class="flex items-center justify-between pt-3 border-t border-slate-100">

  <script>
    // Configurações do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAtiJIROH430x8BwgM1WQGLwABALMoq_sg",
      authDomain: "realtime-database-d7ca2.firebaseapp.com",
      databaseURL: "https://realtime-database-d7ca2-default-rtdb.firebaseio.com",
      projectId: "realtime-database-d7ca2",
      storageBucket: "realtime-database-d7ca2.firebasestorage.app",
      messagingSenderId: "886282109249",
      appId: "1:886282109249:web:f76831b8d033fedbe221c0"
    };

    let db = null, tasksRef = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      tasksRef = db.ref("projetos_clickup");
    } catch(e) { console.warn("Firebase offline:", e); }

    let tasks = [];

    const statusConfig = {
      'AGUARDANDO MICROSOFT': { color: 'bg-purple-600', badgeBg: 'bg-purple-100 text-purple-700' },
      'AÇÃO NOSSA': { color: 'bg-purple-700', badgeBg: 'bg-purple-100 text-purple-800' },
      'EM PROGRESSO': { color: 'bg-blue-600', badgeBg: 'bg-blue-100 text-blue-700' },
      'PENDENTE': { color: 'bg-slate-400', badgeBg: 'bg-slate-100 text-slate-600' },
      'CONCLUÍDO': { color: 'bg-emerald-600', badgeBg: 'bg-emerald-100 text-emerald-700' }
    };

    const initialSeedData = [
      { id: 't1', name: 'TSP — confirmar ativação final', status: 'AGUARDANDO MICROSOFT', dueDate: 'qui', priority: 'Alta', assignee: 'SF' },
      { id: 't2', name: 'GTP — cobrar retorno', status: 'AÇÃO NOSSA', dueDate: 'Hoje', priority: 'Urgente', assignee: 'SF' },
      { id: 't3', name: 'Pearson Partner Store', status: 'AÇÃO NOSSA', dueDate: 'Amanhã', priority: 'Alta', assignee: 'SF' }
    ];

    function initSync() {
      if (tasksRef) {
        tasksRef.on('value', (snapshot) => {
          const data = snapshot.val();
          tasks = [];
          if (data) {
            Object.keys(data).forEach(key => tasks.push({ id: key, ...data[key] }));
          } else {
            initialSeedData.forEach(item => tasksRef.child(item.id).set(item));
          }
          renderTasks();
        });
      } else {
        tasks = initialSeedData;
        renderTasks();
      }
    }

    function renderTasks() {
      const container = document.getElementById('taskListContainer');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filteredTasks = tasks.filter(t => t.name.toLowerCase().includes(searchTerm));
      const statuses = ['AGUARDANDO MICROSOFT', 'AÇÃO NOSSA', 'EM PROGRESSO', 'PENDENTE', 'CONCLUÍDO'];

      statuses.forEach(statusKey => {
        const statusGroup = filteredTasks.filter(t => t.status === statusKey);
        const config = statusConfig[statusKey] || statusConfig['PENDENTE'];

        let groupHtml = `
          <div class="space-y-2">
            <div class="flex items-center gap-2 text-xs font-bold text-slate-700">
              <span class="${config.color} text-white px-2 py-0.5 rounded text-[10px] tracking-wider font-extrabold uppercase">
                ${statusKey}
              </span>
              <span class="text-slate-400 font-semibold">${statusGroup.length}</span>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
              <div class="grid grid-cols-12 text-[10px] font-bold text-slate-400 uppercase tracking-wider px-4 py-2 border-b border-slate-100 bg-slate-50/50">
                <div class="col-span-5">Nome</div>
                <div class="col-span-2 text-center">Responsável</div>
                <div class="col-span-2">Data de vencimento</div>
                <div class="col-span-2">Prioridade</div>
                <div class="col-span-1 text-right">Ação</div>
              </div>

              <div class="divide-y divide-slate-100">
        `;

        if (statusGroup.length === 0) {
          groupHtml += `
            <div class="px-4 py-3 text-xs text-slate-400 italic">Nenhuma tarefa neste status.</div>
          `;
        } else {
          statusGroup.forEach(task => {
            let priorityBadge = task.priority === 'Urgente' ? '🚩 Urgente' : (task.priority === 'Alta' ? '🚩 Alta' : '🔷 Normal');
            let dueDateColor = task.dueDate === 'Hoje' ? 'text-rose-600 font-bold' : 'text-slate-600';

            groupHtml += `
              <div onclick="openModal('${task.id}')" class="grid grid-cols-12 items-center px-4 py-2.5 text-xs hover:bg-slate-50 transition cursor-pointer">
                <div class="col-span-5 font-medium text-slate-800 flex items-center gap-2">
                  <i class="fa-regular fa-circle text-slate-300 hover:text-purple-600"></i>
                  <span>${task.name}</span>
                </div>
                <div class="col-span-2 flex justify-center">
                  <span class="w-6 h-6 rounded-full bg-slate-800 text-white font-bold flex items-center justify-center text-[10px]">
                    ${task.assignee || 'SF'}
                  </span>
                </div>
                <div class="col-span-2 ${dueDateColor}">${task.dueDate || '-'}</div>
                <div class="col-span-2 text-slate-600 font-medium">${priorityBadge}</div>
                <div class="col-span-1 text-right text-slate-400 hover:text-slate-600">
                  <i class="fa-solid fa-ellipsis"></i>
                </div>
              </div>
            `;
          });
        }

        groupHtml += `
                <div onclick="openModalForStatus('${statusKey}')" class="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-purple-600 hover:bg-slate-50 cursor-pointer transition flex items-center gap-1">
                  <i class="fa-solid fa-plus text-[10px]"></i> Adicionar Tarefa
                </div>
              </div>
            </div>
          </div>
        `;

        container.innerHTML += groupHtml;
      });
    }

    function openModal(id = null) {
      const modal = document.getElementById('taskModal');
      const deleteBtn = document.getElementById('btnDeleteTask');
      
      if (id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        document.getElementById('taskId').value = task.id;
        document.getElementById('inputName').value = task.name;
        document.getElementById('inputStatus').value = task.status;
        document.getElementById('inputPriority').value = task.priority || 'Alta';
        document.getElementById('inputDueDate').value = task.dueDate || '';
        document.getElementById('inputAssignee').value = task.assignee || 'SF';
        document.getElementById('modalTitle').querySelector('span').textContent = 'Editar Tarefa';
        deleteBtn.classList.remove('hidden');
      } else {
        document.getElementById('taskForm').reset();
        document.getElementById('taskId').value = '';
        document.getElementById('modalTitle').querySelector('span').textContent = 'Nova Tarefa';
        deleteBtn.classList.add('hidden');
      }
      modal.classList.remove('hidden');
    }

    function openModalForStatus(status) {
      openModal();
      document.getElementById('inputStatus').value = status;
    }

    function closeModal() {
      document.getElementById('taskModal').classList.add('hidden');
    }

    document.getElementById('taskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('taskId').value || 'task_' + Date.now();
      const taskData = {
        name: document.getElementById('inputName').value.trim(),
        status: document.getElementById('inputStatus').value,
        priority: document.getElementById('inputPriority').value,
        dueDate: document.getElementById('inputDueDate').value.trim(),
        assignee: document.getElementById('inputAssignee').value.trim().toUpperCase() || 'SF'
      };

      if (tasksRef) {
        tasksRef.child(id).set(taskData);
      } else {
        const index = tasks.findIndex(t => t.id === id);
        if (index !== -1) tasks[index] = { id, ...taskData };
        else tasks.push({ id, ...taskData });
        renderTasks();
      }
      closeModal();
    });

    function deleteTask() {
      const id = document.getElementById('taskId').value;
      if (id && confirm('Deseja realmente excluir esta tarefa?')) {
        if (tasksRef) tasksRef.child(id).remove();
        else {
          tasks = tasks.filter(t => t.id !== id);
          renderTasks();
        }
        closeModal();
      }
    }

    document.getElementById('searchInput').addEventListener('input', renderTasks);

    initSync();
  </script>
</body>
</html>
